name: release archives

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package exact-tag archives
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: require a tag
        id: candidate
        run: |
          test "$GITHUB_REF_TYPE" = tag
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: internal/webui/pnpm-lock.yaml
      - name: validate and package
        run: ./scripts/release.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/
          if-no-files-found: error

  native-smoke:
    name: verify ${{ matrix.os }}/${{ matrix.arch }} release archive
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: darwin
            arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/
      - name: verify checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
      - name: smoke the actual release archive
        env:
          VERSION: ${{ needs.package.outputs.version }}
          COMMIT: ${{ needs.package.outputs.commit }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./scripts/smoke/archive.sh "dist/skillctl_${VERSION}_${TARGET_OS}_${TARGET_ARCH}.tar.gz" "$VERSION" "$COMMIT"
