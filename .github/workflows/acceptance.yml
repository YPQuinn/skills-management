name: acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  candidate:
    name: record candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "candidate ${sha}"
          test "${sha}" = "${GITHUB_SHA}"

  linux-amd64-functional:
    name: linux/amd64 functional
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: same candidate
        run: test "$(git rev-parse HEAD)" = "${{ needs.candidate.outputs.sha }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            internal/webui/package-lock.json
            e2e/webui/package-lock.json
      - name: quality gate
        run: ./scripts/check.sh
      - name: race
        run: go test -race ./...
      - name: native archive smoke
        run: ./scripts/smoke/native-archive.sh
      - name: Playwright
        run: ./scripts/e2e-webui.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-linux
          path: e2e/webui/test-results

  darwin-arm64-functional:
    name: darwin/arm64 functional
    needs: candidate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: same candidate
        run: test "$(git rev-parse HEAD)" = "${{ needs.candidate.outputs.sha }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            internal/webui/package-lock.json
            e2e/webui/package-lock.json
      - name: quality gate
        run: ./scripts/check.sh
      - name: native archive smoke
        run: ./scripts/smoke/native-archive.sh
      - name: Playwright
        run: ./scripts/e2e-webui.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-darwin-arm64
          path: e2e/webui/test-results

  linux-arm64-archive-smoke:
    name: linux/arm64 archive smoke
    needs: candidate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: same candidate
        run: test "$(git rev-parse HEAD)" = "${{ needs.candidate.outputs.sha }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/webui/package-lock.json
      - run: ./scripts/smoke/native-archive.sh

  darwin-amd64-archive-smoke:
    name: darwin/amd64 archive smoke
    needs: candidate
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: same candidate
        run: test "$(git rev-parse HEAD)" = "${{ needs.candidate.outputs.sha }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/webui/package-lock.json
      - run: ./scripts/smoke/native-archive.sh
