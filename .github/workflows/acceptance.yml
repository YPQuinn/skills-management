name: acceptance

# Branch pushes are covered by their pull request; running both events would
# execute the whole matrix twice for one commit. Tags are owned by
# release-archives.yml, whose release.sh already runs this gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-amd64-functional:
    name: linux/amd64 functional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/webui/package-lock.json
      - name: quality gate
        env:
          GO_TEST_FLAGS: -race
        run: ./scripts/check.sh
      - name: native archive smoke
        run: ./scripts/smoke/native-archive.sh
      # darwin/amd64 has no per-push native job; release-archives.yml executes
      # its real archive on a native runner at tag time.
      - name: cross-compile darwin/amd64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/skillctl

  darwin-arm64-functional:
    name: darwin/arm64 functional
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/webui/package-lock.json
      # Frontend type checking, lint, and Vitest are platform-independent and
      # already ran on Linux. macOS builds the SPA only because internal/webui
      # embeds it, then runs the filesystem-sensitive Go suite.
      - name: build
        run: ./scripts/build.sh
      - name: go test
        run: go test ./...
      - name: native archive smoke
        run: ./scripts/smoke/native-archive.sh

  linux-arm64-archive-smoke:
    name: linux/arm64 archive smoke
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/webui/package-lock.json
      - run: ./scripts/smoke/native-archive.sh
