<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Manager</title>
    <script>
      (function (storageKey, defaultTheme, forcedTheme, themes, value, enableSystem, enableColorScheme) {
        var el = document.documentElement
        var system = ['light', 'dark']
        var classFor = function (t) { return value && value[t] ? value[t] : t }
        var updateDOM = function (theme) {
          el.classList.remove.apply(el.classList, themes.map(classFor))
          el.classList.add(classFor(theme))
          if (enableColorScheme && system.indexOf(theme) !== -1) el.style.colorScheme = theme
        }
        if (forcedTheme) {
          updateDOM(forcedTheme)
          return
        }
        try {
          var stored = localStorage.getItem(storageKey) || defaultTheme
          var resolved = enableSystem && stored === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : stored
          updateDOM(resolved)
        } catch (e) {}
      })('theme', 'system', null, ['light', 'dark'], null, true, true)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
